# Project
# Version string only used in dev, however when making a tag on github it should be like major.minor.bug.mc+loader
# Example: 1.0.0. 1 21 01 2 notice the minecraft version hidden there at the end?
# and the 2 means it's for NeoForge while 1 is Forge and I suspect if we did Fabric mods 3 would be for that.
# (This also helps for bug reports as the version number gives us a clue as to what version of Minecraft the bug happened on)
mod_version = 3.0.3.121012
mod_name = SteamAdvantage
mod_id = steamadvantage
mod_archive_name = SteamAdvantage
mod_description = Steam-powered industry.
mod_group = zone.moddev.mc.steamadvantage
mod_authors = DrCyano, DShadowWolf
mod_license = LGPL 2.1
# CurseForge project. The publish workflow uploads to curseforge_id; build.gradle builds the mod's
# displayURL from curseforge_slug. Keep the homepage in update.json in step with the slug.
curseforge_id = 1781954
curseforge_slug = steam-advantage-revived
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/SA3/refs/heads/main/update.json
issue_url = https://github.com/MinecraftModDevelopmentMods/SA3/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.21.2)
neoforge_version = 21.1.265
neoforge_version_range = [21.1.265,21.2)
loader_version_range = [4,)
mmdlib_version = 2.0.0.12102+Neo
mmdlib_version_range = [2.0.0-alpha,3)
poweradvantage_version = 3.1.1.121012+Neo
poweradvantage_version_range = [3.0.0,4)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false
